<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Depan Kamar Elvira</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efe2c4; --bg-panel:#f8f0dd; --bg-panel-2:#e7d7ae;
    --gold:#a8763a; --blush:#a23b2e; --text:#2b2118; --text-muted:#8a7757;
    --line:rgba(43,33,24,0.16);
    --font-display:"Fraunces",serif; --font-body:"Plus Jakarta Sans",sans-serif; --font-mono:"JetBrains Mono",monospace;
    --room-ar: 2914 / 1440;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overflow:hidden; }
  body{ font-family:var(--font-body); color:var(--text); background:#2b2118; }
  img{ image-rendering:pixelated; image-rendering:crisp-edges; }

  .viewport{ position:fixed; inset:0; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; cursor:grab; background:#1c140c; white-space:nowrap; }
  .viewport::-webkit-scrollbar{ display:none; }
  .viewport.grabbing{ cursor:grabbing; }
  .stage{ position:relative; display:inline-block; height:100%; vertical-align:top; }
  .room-bg{ height:100%; width:auto; display:block; aspect-ratio:var(--room-ar);
    user-select:none; -webkit-user-drag:none; }

  /* hotspot pintu — area klik tak terlihat di atas pintu gambar (tanpa hiasan CSS) */
  .door-hot{ position:absolute; transform:translate(-50%,-50%); background:transparent; border:none;
    padding:0; cursor:pointer; z-index:4; }

  .banner{ position:fixed; top:0; left:0; right:0; text-align:center; padding:14px 16px 24px;
    font-family:var(--font-display); font-weight:600; font-size:clamp(17px,4.6vw,24px); color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,.55); background:linear-gradient(to bottom, rgba(43,33,24,.45), transparent);
    z-index:15; pointer-events:none; }
  .hint-tap{ position:fixed; bottom:16px; left:0; right:0; text-align:center; font-family:var(--font-mono);
    font-size:12px; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.6); z-index:15; pointer-events:none; opacity:.9; }

  /* ---------- MODAL PASSWORD ---------- */
  .lock-overlay{ position:fixed; inset:0; background:rgba(43,33,24,.6); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; padding:24px; z-index:20; }
  .lock-overlay.show{ display:flex; animation:fadeIn .2s ease; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .lock-card{ position:relative; width:100%; max-width:320px; background:var(--bg-panel);
    border:2.5px solid var(--text); border-radius:3px; padding:24px 20px 20px; text-align:center;
    box-shadow:6px 7px 0 rgba(43,33,24,.24); animation:pop .28s ease; }
  .lock-card::before{ content:""; position:absolute; inset:0; border:2.5px solid var(--text);
    border-radius:3px; filter:url(#sketchy); pointer-events:none; }
  .lock-card::after{ content:""; position:absolute; top:-11px; left:50%; width:112px; height:22px;
    transform:translateX(-50%) rotate(-3deg); background:rgba(168,118,58,.35);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.25); }
  @keyframes pop{ from{opacity:0; transform:translateY(8px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }
  .lock-card.shake{ animation:shake .4s ease; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }
  .lock-icon{ margin:0 auto 4px; font-size:30px; line-height:1; }
  .lock-title{ font-family:var(--font-display); font-weight:600; font-size:20px; color:var(--text); }
  .lock-sub{ font-family:var(--font-mono); font-size:11px; color:var(--text-muted); margin:8px 0 4px; line-height:1.5; }
  .lock-hint{ font-size:12px; color:var(--blush); margin-bottom:14px; }
  .lock-hint b{ font-weight:600; }
  .lock-form{ display:flex; flex-direction:column; gap:10px; }
  .lock-input{ width:100%; background:var(--bg-panel-2); border:1.5px solid var(--line); border-radius:10px;
    padding:12px 14px; font-family:var(--font-mono); font-size:15px; color:var(--text); text-align:center; letter-spacing:.14em; }
  .lock-input:focus{ outline:none; border-color:var(--blush); }
  .lock-input::placeholder{ letter-spacing:normal; color:var(--text-muted); }
  .lock-go{ width:100%; background:var(--blush); color:#f8f0dd; border:none; border-radius:10px; padding:12px;
    font-weight:600; cursor:pointer; font-size:14px; }
  .lock-go:hover{ filter:brightness(1.06); }
  .lock-err{ color:var(--blush); font-family:var(--font-mono); font-size:11px; min-height:16px; margin-top:10px; }
  .lock-close{ position:absolute; top:-13px; right:-13px; width:30px; height:30px; border-radius:50%;
    background:var(--bg-panel); color:var(--text); border:2px solid var(--text); font-size:14px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:4;
    box-shadow:2px 2px 0 rgba(43,33,24,.2); }

  .enter-fade{ position:fixed; inset:0; background:#1c140c; z-index:40; opacity:0; pointer-events:none;
    transition:opacity .7s ease; }
  .enter-fade.show{ opacity:1; pointer-events:all; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="sketchy">
    <feTurbulence type="fractalNoise" baseFrequency="0.045 0.09" numOctaves="2" seed="4" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2"/>
  </filter>
</svg>

<div class="viewport" id="viewport">
  <div class="stage" id="stage">
    <img class="room-bg" src="assets/depan.png" alt="Depan kamar">
    <button class="door-hot" id="door" aria-label="Pintu kamar" style="left:49%; top:52%; width:17.5%; height:64%;"></button>
  </div>
</div>

<div class="banner">Kamar Elvira</div>
<div class="hint-tap" id="hintTap">geser-geser dulu &middot; ketuk pintunya buat masuk</div>

<!-- MODAL PASSWORD -->
<div class="lock-overlay" id="lockOverlay">
  <div class="lock-card" id="lockCard">
    <button class="lock-close" id="lockClose">✕</button>
    <div class="lock-icon">🔒</div>
    <div class="lock-title">Eh, kekunci nih</div>
    <div class="lock-sub">ketik password dulu ya biar bisa masuk 😚</div>
    <div class="lock-hint">💡 Hint: <b>nama depan kamu</b></div>
    <div class="lock-form">
      <input class="lock-input" id="lockInput" type="text" placeholder="ketik password…" autocomplete="off" spellcheck="false">
      <button class="lock-go" id="lockGo">Masuk~</button>
    </div>
    <div class="lock-err" id="lockErr"></div>
  </div>
</div>

<div class="enter-fade" id="enterFade"></div>

<script>
if (window.Telegram && window.Telegram.WebApp) { const tg = window.Telegram.WebApp; tg.ready(); tg.expand(); }

const PASSWORD = 'elvira';
const viewport = document.getElementById('viewport');
const lockOverlay = document.getElementById('lockOverlay');
const lockCard = document.getElementById('lockCard');
const lockInput = document.getElementById('lockInput');
const lockErr = document.getElementById('lockErr');
const enterFade = document.getElementById('enterFade');
const hintTap = document.getElementById('hintTap');

// pas buka, geser biar pintunya di tengah layar
function centerDoor(){
  const s = document.getElementById('stage');
  viewport.scrollLeft = (s.scrollWidth - viewport.clientWidth) / 2;
}
window.addEventListener('load', () => setTimeout(centerDoor, 60));
window.addEventListener('resize', centerDoor);

function openLock(){
  lockOverlay.classList.add('show'); lockErr.textContent = '';
  setTimeout(() => lockInput.focus(), 200);
}
function closeLock(){ lockOverlay.classList.remove('show'); }

document.getElementById('door').addEventListener('click', () => { if (!viewport._drag) openLock(); });
document.getElementById('lockClose').addEventListener('click', closeLock);
lockOverlay.addEventListener('click', e => { if (e.target === lockOverlay) closeLock(); });

function tryEnter(){
  const val = (lockInput.value || '').trim().toLowerCase();
  if (val === PASSWORD){
    lockErr.style.color = 'var(--gold)';
    lockErr.textContent = 'Yeay, masuk~ 💛';
    enterFade.classList.add('show');
    setTimeout(() => { location.href = 'sore.html'; }, 750);
  } else {
    lockErr.style.color = 'var(--blush)';
    lockErr.textContent = 'Salah, coba lagi ya 🙈 (hint: nama depan kamu)';
    lockCard.classList.remove('shake'); void lockCard.offsetWidth; lockCard.classList.add('shake');
    lockInput.select();
  }
}
document.getElementById('lockGo').addEventListener('click', tryEnter);
lockInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryEnter(); });

/* ---------- geser horizontal (mouse drag) ---------- */
viewport._drag = false;
let down=false, startX=0, startLeft=0;
viewport.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse') return;
  down=true; viewport._drag=false; startX=e.clientX; startLeft=viewport.scrollLeft; viewport.classList.add('grabbing');
});
viewport.addEventListener('pointermove', e => {
  if (!down) return;
  const dx = e.clientX - startX;
  if (Math.abs(dx) > 6) viewport._drag = true;
  viewport.scrollLeft = startLeft - dx;
});
function endDrag(){ down=false; viewport.classList.remove('grabbing'); setTimeout(()=>viewport._drag=false, 30); }
viewport.addEventListener('pointerup', endDrag);
viewport.addEventListener('pointerleave', endDrag);
viewport.addEventListener('scroll', () => { hintTap.style.opacity = 0; }, { once:true });
</script>
</body>
</html>
