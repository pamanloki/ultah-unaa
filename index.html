<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kamar Elvira</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efe2c4; --bg-panel:#f8f0dd; --bg-panel-2:#e7d7ae;
    --gold:#a8763a; --blush:#a23b2e; --text:#2b2118; --text-muted:#8a7757;
    --line:rgba(43,33,24,0.16);
    --font-display:"Fraunces",serif; --font-body:"Plus Jakarta Sans",sans-serif; --font-mono:"JetBrains Mono",monospace;

    /* ---- rasio gambar room asli: lebar / tinggi ---- */
    --room-ar: 2000 / 989;
    /* ---- lebar 1 frame kucing ---- */
    --cat-fw: clamp(78px, 15vh, 128px);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{ background:#2b2118; color:var(--text); font-family:var(--font-body); }
  img{ image-rendering:pixelated; image-rendering:crisp-edges; }

  /* ---------- VIEWPORT: geser horizontal ---------- */
  .viewport{
    position:fixed; inset:0;
    overflow-x:auto; overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    cursor:grab;
    background:#000;
    white-space:nowrap;
  }
  .viewport::-webkit-scrollbar{ display:none; }
  .viewport.grabbing{ cursor:grabbing; }

  /* ---------- STAGE: kamar (setinggi layar, selebar rasio room) ---------- */
  .stage{
    position:relative;
    display:inline-block;
    height:100%;
    vertical-align:top;
  }
  .room-bg{
    height:100%; width:auto; display:block;
    aspect-ratio: var(--room-ar);
    user-select:none; -webkit-user-drag:none;
  }

  /* debu/cahaya melayang */
  .dust{ position:absolute; width:3px; height:3px; border-radius:50%;
    background:rgba(255,240,190,0.85); pointer-events:none;
    animation:floatUp linear infinite; opacity:0; }
  @keyframes floatUp{
    0%{ transform:translateY(20px); opacity:0; }
    15%{ opacity:.9; } 85%{ opacity:.6; }
    100%{ transform:translateY(-120px); opacity:0; }
  }

  /* ---------- OBJEK INTERAKTIF ---------- */
  .obj{
    position:absolute; transform:translate(-50%,-50%);
    background:transparent; border:none; padding:0; cursor:pointer; display:block;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,0.28));
    transition:transform .18s ease, filter .18s ease;
  }
  .obj img{ width:100%; height:auto; display:block; pointer-events:none; -webkit-user-drag:none; }
  .obj::after{ content:""; position:absolute; inset:-12%; border-radius:50%;
    box-shadow:0 0 0 0 rgba(255,238,180,0); transition:box-shadow .2s ease; pointer-events:none; }
  .obj:hover{ transform:translate(-50%,-50%) scale(1.06); filter:drop-shadow(0 4px 8px rgba(0,0,0,0.35)) brightness(1.06); }
  .obj:hover::after,.obj:focus-visible::after{ box-shadow:0 0 22px 6px rgba(255,238,180,0.55); }
  .obj:active{ transform:translate(-50%,-50%) scale(0.95); }

  @keyframes wiggle{ 0%,100%{ transform:translate(-50%,-50%) rotate(-5deg);} 50%{ transform:translate(-50%,-50%) rotate(5deg);} }
  .anim-wiggle{ animation:wiggle 1.4s ease-in-out infinite; transform-origin:center; }
  .anim-wiggle:hover{ animation-play-state:paused; }
  @keyframes bob{ 0%,100%{ transform:translate(-50%,-50%) translateY(0);} 50%{ transform:translate(-50%,-50%) translateY(-8px);} }
  .anim-bob{ animation:bob 2.8s ease-in-out infinite; }
  @keyframes pulseGlow{ 0%,100%{ filter:drop-shadow(0 0 2px rgba(255,238,180,0.2)) drop-shadow(0 3px 4px rgba(0,0,0,0.28)); }
    50%{ filter:drop-shadow(0 0 11px rgba(255,238,180,0.75)) drop-shadow(0 3px 4px rgba(0,0,0,0.28)); } }
  .anim-glow{ animation:pulseGlow 3s ease-in-out infinite; }

  /* ---------- KUCING (sprite 8 frame) ---------- */
  .cat{
    position:absolute; transform:translate(-50%,-50%);
    width:var(--cat-fw); aspect-ratio:259 / 232;
    background-image:url("assets/cat.png"); background-repeat:no-repeat;
    background-size:calc(var(--cat-fw) * 8) 100%; background-position:0 0;
    image-rendering:pixelated; cursor:pointer;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,0.3));
    animation:catIdle 1.15s steps(8) infinite;
  }
  @keyframes catIdle{ to{ background-position:calc(var(--cat-fw) * -8) 0; } }
  .cat.happy{ animation:catIdle .55s steps(8) infinite; }

  .bubble{ position:absolute; transform:translate(-50%,-100%);
    background:var(--bg-panel); color:var(--text); font-family:var(--font-mono); font-size:11px;
    padding:6px 10px; border-radius:10px; white-space:nowrap; border:1.5px solid var(--line);
    opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:6; }
  .bubble.show{ opacity:1; }

  /* ---------- HOTSPOT (peta dinding, tanpa gambar sendiri) ---------- */
  .hotspot{ position:absolute; transform:translate(-50%,-50%);
    background:transparent; border:none; padding:0; cursor:pointer; z-index:4; }
  .hotspot::after{ content:""; position:absolute; inset:0; border-radius:6px;
    box-shadow:0 0 0 0 rgba(255,238,180,0); transition:box-shadow .25s ease; }
  .hotspot:hover::after,.hotspot:focus-visible::after{
    box-shadow:0 0 0 3px rgba(255,238,180,.75), 0 0 24px 8px rgba(255,238,180,.4); }
  .map-tip{ position:absolute; transform:translate(-50%,-135%);
    background:var(--text); color:var(--bg-panel); font-family:var(--font-mono); font-size:11px;
    padding:5px 9px; border-radius:8px; white-space:nowrap; opacity:0; pointer-events:none;
    transition:opacity .2s ease; z-index:16; }
  .map-tip.show{ opacity:1; }

  /* ---------- MAP PANEL (slide-in ala referensi) ---------- */
  .mappanel{ position:fixed; inset:0; z-index:45; display:none; }
  .mappanel.show{ display:flex; }
  .mappanel-backdrop{ position:absolute; inset:0; background:rgba(43,33,24,.55); backdrop-filter:blur(2px); }
  .mappanel-inner{ position:relative; display:flex; width:100%; height:100%; }
  .mappanel-info{ width:min(42%,420px); background:var(--bg); color:var(--text);
    padding:40px 34px; overflow:auto; z-index:2;
    transform:translateX(-100%); transition:transform .45s cubic-bezier(.2,.8,.2,1); }
  .mappanel.show .mappanel-info{ transform:translateX(0); }
  .mappanel-eyebrow{ font-family:var(--font-mono); font-size:12px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--gold); margin-bottom:10px; }
  .mappanel-title{ font-family:var(--font-display); font-weight:700; font-size:clamp(30px,6vw,48px);
    line-height:1; margin-bottom:18px; }
  .mappanel-body{ font-size:15px; line-height:1.7; color:var(--text); max-width:34ch; }
  .mappanel-body b{ color:var(--blush); }
  .mappanel-map{ flex:1; display:flex; align-items:center; justify-content:center; padding:24px;
    min-width:0; overflow:hidden; }
  .mappanel-map img{ max-width:100%; max-height:100%; object-fit:contain; image-rendering:pixelated;
    animation:mapZoom .6s cubic-bezier(.2,.8,.2,1) both; filter:drop-shadow(0 8px 24px rgba(0,0,0,.4)); }
  @keyframes mapZoom{ from{ opacity:0; transform:scale(1.18); } to{ opacity:1; transform:scale(1); } }
  .mappanel-close{ position:absolute; top:16px; right:16px; width:38px; height:38px; border-radius:50%;
    background:var(--bg-panel); color:var(--text); border:1.5px solid var(--line); font-size:17px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:3; }
  @media (max-width:640px){
    .mappanel-inner{ flex-direction:column; }
    .mappanel-info{ width:100%; transform:translateY(100%); padding:22px 22px 30px; }
    .mappanel.show .mappanel-info{ transform:translateY(0); }
    .mappanel-map{ padding:16px 16px 8px; }
  }

  /* ---------- OVERLAY UI (nempel di layar, nggak ikut geser) ---------- */
  .banner{ position:fixed; top:0; left:0; right:0; text-align:center; padding:14px 16px 24px;
    font-family:var(--font-display); font-weight:600; font-size:clamp(17px,4.6vw,22px); color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,0.55);
    background:linear-gradient(to bottom, rgba(43,33,24,0.5), transparent); z-index:15; pointer-events:none; }
  .hint-tap{ position:fixed; bottom:16px; left:0; right:0; text-align:center;
    font-family:var(--font-mono); font-size:12px; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,0.6);
    z-index:15; pointer-events:none; opacity:.9; transition:opacity .4s ease; }
  .hint-tap .arrow{ display:inline-block; animation:nudge 1.4s ease-in-out infinite; }
  @keyframes nudge{ 0%,100%{ transform:translateX(0);} 50%{ transform:translateX(6px);} }

  /* ---------- MODAL ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(43,33,24,0.55); backdrop-filter:blur(2px);
    display:none; align-items:center; justify-content:center; padding:24px; z-index:30; }
  .modal-overlay.show{ display:flex; animation:fadeIn .2s ease; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .modal-card{ position:relative; max-width:300px; width:100%; background:var(--bg-panel);
    border-radius:16px; padding:14px; animation:pop .25s ease; white-space:normal; }
  .modal-card::before{ content:""; position:absolute; inset:0; border:2px solid var(--line);
    border-radius:inherit; filter:url(#sketchy); pointer-events:none; }
  .modal-art{ background:repeating-linear-gradient(45deg,var(--bg-panel-2) 0 5px,var(--bg-panel) 5px 10px);
    border-radius:10px; padding:22px 10px 16px; display:flex; flex-direction:column; align-items:center; gap:8px; position:relative; }
  .modal-art::before{ content:""; position:absolute; inset:0; border:1.5px solid var(--line); border-radius:inherit; filter:url(#sketchy); pointer-events:none; }
  .modal-icon svg{ width:46px; height:46px; color:var(--blush); }
  .modal-title{ font-family:var(--font-display); font-weight:600; font-size:17px; color:var(--text); }
  .modal-num{ font-family:var(--font-mono); font-size:10px; letter-spacing:.04em; color:var(--text-muted); }
  .modal-text-box{ background:var(--bg-panel-2); border-radius:10px; padding:14px; margin-top:10px; position:relative; }
  .modal-text-box::before{ content:""; position:absolute; inset:0; border:1.5px solid var(--line); border-radius:inherit; filter:url(#sketchy); pointer-events:none; }
  .modal-text{ font-size:14px; line-height:1.6; color:var(--text); position:relative; }
  .modal-close{ position:absolute; top:-14px; right:-14px; width:32px; height:32px; border-radius:50%;
    background:var(--bg-panel); color:var(--text); border:1.5px solid var(--line); font-size:15px;
    display:flex; align-items:center; justify-content:center; z-index:2; cursor:pointer; }
  @keyframes pop{ from{opacity:0; transform:translateY(6px) scale(0.97);} to{opacity:1; transform:translateY(0) scale(1);} }

  .confetti{ position:fixed; top:-10px; pointer-events:none; width:7px; height:10px; border-radius:2px;
    animation:fall 1.4s linear forwards; z-index:50; }
  @keyframes fall{ to{ transform:translateY(100vh) rotate(360deg); opacity:.2; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="sketchy">
    <feTurbulence type="fractalNoise" baseFrequency="0.045 0.09" numOctaves="2" seed="4" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2"/>
  </filter>
</svg>

<div class="viewport" id="viewport">
  <div class="stage" id="stage">
    <img class="room-bg" id="roomBg" src="assets/room.png" alt="kamar">
    <!-- objek diisi lewat JS -->
    <button class="hotspot" id="mapHotspot" aria-label="Peta" style="left:50.5%; top:34%; width:17.5%; height:17%;"></button>
    <div class="map-tip" id="mapTip" style="left:50.5%; top:26%;">Bekasi &middot; colek aku</div>
  </div>
</div>

<div class="hint-tap" id="hintTap">geser buat ubek-ubek kamar <span class="arrow">→</span></div>

<!-- MAP PANEL -->
<div class="mappanel" id="mapPanel">
  <div class="mappanel-backdrop" id="mapBackdrop"></div>
  <div class="mappanel-inner">
    <div class="mappanel-info">
      <div class="mappanel-eyebrow">di sini cerita kita</div>
      <div class="mappanel-title">Bekasi</div>
      <div class="mappanel-body">
        Kota tempat semua ini bermula. [ganti teksnya sesukamu, Elvira —
        cerita apa aja soal Bekasi buat kalian berdua].
      </div>
    </div>
    <div class="mappanel-map">
      <img id="petaImg" src="assets/peta.png" alt="Peta Bekasi"
           onerror="this.style.display='none';">
    </div>
    <button class="mappanel-close" id="mapClose">✕</button>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-art">
      <span class="modal-icon" id="modalIcon"></span>
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-num" id="modalNum"></div>
    </div>
    <div class="modal-text-box"><div class="modal-text" id="modalText"></div></div>
  </div>
</div>

<script>
if (window.Telegram && window.Telegram.WebApp) { const tg = window.Telegram.WebApp; tg.ready(); tg.expand(); }

/* ============================================================
   KONFIG OBJEK — tambah/ubah di sini (satu-satu)
   x,y = posisi tengah objek dlm % dari kamar; w = lebar % dari kamar
   anim = 'wiggle' | 'bob' | 'glow' | null
   ============================================================ */
const iconEnvelope='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M3 6l9 6 9-6"/></svg>';
const iconHeart='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20s-7-4.4-9.5-9C.8 7.8 2.6 4 6.2 4c2 0 3.4 1.1 4 2.4C10.8 5.1 12.2 4 14.2 4c3.6 0 5.4 3.8 3.7 7-2.5 4.6-9.5 9-9.5 9z"/></svg>';
const iconGift='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="9" width="18" height="11" rx="1"/><path d="M3 9h18M12 9v11"/></svg>';

const OBJECTS = [
  { id:'balon',   img:'assets/balon.png',    x:31, y:23, w:6.5, anim:'bob',
    title:'Balon', icon:iconHeart,
    msg:'Kalau kamu jadi karakter game, kamu bakal jadi karakter yang [sifat lucu/positif].' },
  { id:'foto',    img:'assets/foto.png',     x:31, y:43, w:6,   anim:'glow',
    title:'Foto Kita', icon:iconHeart,
    msg:'Alasan random tapi jujur kenapa aku notice kamu: cara kamu ketawa waktu bahas hal receh.' },
  { id:'kue',     img:'assets/kue.png',      x:43, y:56, w:4.5, anim:'glow',
    title:'Kue', icon:iconHeart,
    msg:'Met ulang tahun ya. Makasih udah jadi orang yang bikin hari-hari biasa jadi lebih seru.' },
  { id:'amplop',  img:'assets/envelope.png', x:71, y:81, w:3.5, anim:'wiggle',
    title:'Amplop', icon:iconEnvelope,
    msg:'Satu hal yang pengen aku bilang tapi belum sempat: [isi pesan].' },
  { id:'kado',    img:'assets/kado.png',     x:50, y:74, w:4.5, anim:'bob',
    title:'Kado', icon:iconGift,
    msg:'Fun fact: dari sekian banyak chat, aku paling inget waktu kamu cerita soal [isi kenangan].' },
];

const stage = document.getElementById('stage');
const hintTap = document.getElementById('hintTap');

OBJECTS.forEach(o => {
  const btn = document.createElement('button');
  btn.className = 'obj' + (o.anim ? ' anim-' + o.anim : '');
  btn.style.left = o.x + '%'; btn.style.top = o.y + '%'; btn.style.width = o.w + '%';
  btn.setAttribute('aria-label', o.title);
  btn.innerHTML = `<img src="${o.img}" alt="${o.title}">`;
  btn.addEventListener('click', () => { if (viewport._drag) return; openModal(o.title, o.icon, o.msg); });
  stage.appendChild(btn);
});

/* ---------- KUCING ---------- */
const CAT = { x:66, y:86, meows:['meong','meong ~','meoong','meeeong'] };
const cat = document.createElement('div');
cat.className = 'cat'; cat.style.left = CAT.x + '%'; cat.style.top = CAT.y + '%';
stage.appendChild(cat);
const bubble = document.createElement('div'); bubble.className = 'bubble'; stage.appendChild(bubble);
cat.addEventListener('click', () => {
  if (viewport._drag) return;
  cat.classList.add('happy');
  bubble.textContent = CAT.meows[Math.floor(Math.random()*CAT.meows.length)];
  bubble.style.left = CAT.x + '%'; bubble.style.top = (CAT.y - 11) + '%'; bubble.classList.add('show');
  burstConfetti(10);
  clearTimeout(cat._t);
  cat._t = setTimeout(() => { cat.classList.remove('happy'); bubble.classList.remove('show'); }, 1600);
});

/* ---------- modal ---------- */
const modalOverlay=document.getElementById('modalOverlay');
const modalIcon=document.getElementById('modalIcon'), modalTitle=document.getElementById('modalTitle');
const modalNum=document.getElementById('modalNum'), modalText=document.getElementById('modalText');
document.getElementById('modalClose').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
function openModal(title, icon, msg){
  modalTitle.textContent=title; modalIcon.innerHTML=icon; modalNum.textContent=''; modalText.textContent=msg;
  modalOverlay.classList.add('show'); hintTap.style.opacity=0; burstConfetti(16);
}
function closeModal(){ modalOverlay.classList.remove('show'); }

/* ---------- PETA DINDING: klik -> panel geser + zoom ---------- */
const mapHotspot = document.getElementById('mapHotspot');
const mapTip = document.getElementById('mapTip');
const mapPanel = document.getElementById('mapPanel');
const petaImg = document.getElementById('petaImg');
mapHotspot.addEventListener('mouseenter', () => mapTip.classList.add('show'));
mapHotspot.addEventListener('mouseleave', () => mapTip.classList.remove('show'));
mapHotspot.addEventListener('click', () => {
  if (viewport._drag) return;
  mapTip.classList.remove('show');
  // retrigger animasi zoom tiap dibuka
  if (petaImg.style.display !== 'none') { petaImg.style.animation='none'; void petaImg.offsetWidth; petaImg.style.animation=''; }
  mapPanel.classList.add('show');
  hintTap.style.opacity = 0;
});
function closeMapPanel(){ mapPanel.classList.remove('show'); }
document.getElementById('mapClose').addEventListener('click', closeMapPanel);
document.getElementById('mapBackdrop').addEventListener('click', closeMapPanel);

/* ---------- geser horizontal (mouse drag; sentuh pakai scroll native) ---------- */
const viewport = document.getElementById('viewport');
viewport._drag = false;
let down=false, startX=0, startLeft=0;
viewport.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse') return;
  down=true; viewport._drag=false; startX=e.clientX; startLeft=viewport.scrollLeft;
  viewport.classList.add('grabbing');
});
viewport.addEventListener('pointermove', e => {
  if (!down) return;
  const dx = e.clientX - startX;
  if (Math.abs(dx) > 6) viewport._drag = true;
  viewport.scrollLeft = startLeft - dx;
});
function endDrag(){ down=false; viewport.classList.remove('grabbing'); setTimeout(()=>viewport._drag=false, 30); }
viewport.addEventListener('pointerup', endDrag);
viewport.addEventListener('pointerleave', endDrag);
// sembunyikan hint setelah user mulai geser
viewport.addEventListener('scroll', () => { hintTap.style.opacity = 0; }, { once:true });

/* ---------- debu ---------- */
(function makeDust(){
  for (let i=0;i<16;i++){
    const d=document.createElement('div'); d.className='dust';
    d.style.left=Math.random()*100+'%'; d.style.top=(40+Math.random()*55)+'%';
    d.style.animationDuration=(5+Math.random()*6)+'s'; d.style.animationDelay=(Math.random()*6)+'s';
    stage.appendChild(d);
  }
})();

/* ---------- confetti ---------- */
function burstConfetti(n){
  const colors=['#a8763a','#a23b2e','#f8f0dd','#e7d7ae'];
  for (let i=0;i<n;i++){
    const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'vw'; c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay=(Math.random()*0.4)+'s'; c.style.animationDuration=(1.1+Math.random()*0.8)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),2200);
  }
}
</script>
</body>
</html>
