<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Depan Kamar Elvira</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efe2c4; --bg-panel:#f8f0dd; --bg-panel-2:#e7d7ae;
    --gold:#a8763a; --blush:#a23b2e; --text:#2b2118; --text-muted:#8a7757;
    --line:rgba(43,33,24,0.16);
    --font-display:"Fraunces",serif; --font-body:"Plus Jakarta Sans",sans-serif; --font-mono:"JetBrains Mono",monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overflow:hidden; }
  body{ font-family:var(--font-body); color:var(--text); background:#2b2118; }
  img{ image-rendering:pixelated; }

  /* ---------- RUANGAN DEPAN ---------- */
  .hall{ position:fixed; inset:0; overflow:hidden; display:flex; align-items:flex-end; justify-content:center;
    background:
      radial-gradient(900px 520px at 50% 26%, rgba(255,228,170,.55) 0%, rgba(255,228,170,0) 60%),
      linear-gradient(180deg, #d8bd8f 0%, #cdae7c 46%, #b98f57 62%, #a97e49 100%); }
  /* kalau kamu punya gambar ruangan depan sendiri, taruh assets/depan.png */
  .hall-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  /* lantai kayu */
  .floor{ position:absolute; left:0; right:0; bottom:0; height:26%;
    background:repeating-linear-gradient(90deg, #9c6f3e 0 40px, #8f6537 40px 80px);
    box-shadow:inset 0 12px 24px rgba(0,0,0,.22); }
  .rug{ position:absolute; left:50%; bottom:2%; transform:translateX(-50%);
    width:min(62vw,420px); height:9%; border-radius:50%;
    background:radial-gradient(ellipse at center, #a23b2e 0 38%, #c98b46 38% 62%, #7f5a30 62% 100%);
    box-shadow:0 6px 18px rgba(0,0,0,.28); opacity:.92; }

  /* ---------- PINTU ---------- */
  .door-wrap{ position:relative; z-index:3; width:min(52vw,300px); margin-bottom:9%;
    display:flex; flex-direction:column; align-items:center; }
  .plaque{ font-family:var(--font-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:#5a3f28; background:var(--bg-panel); border:1.5px solid var(--line); border-radius:8px;
    padding:5px 12px; margin-bottom:14px; box-shadow:0 3px 8px rgba(0,0,0,.2); }
  .door{ position:relative; width:100%; aspect-ratio:1/1.85; cursor:pointer; border:none; padding:0;
    background:linear-gradient(180deg,#8a5a2f,#6f471f); border-radius:10px 10px 6px 6px;
    box-shadow:0 0 0 8px #5c3a19, 0 0 0 12px #7a5228, 0 18px 34px rgba(0,0,0,.45), inset 0 0 30px rgba(0,0,0,.28);
    transition:transform .18s ease, filter .18s ease; }
  .door:hover{ filter:brightness(1.07); transform:translateY(-2px); }
  .door:active{ transform:scale(.99); }
  .door::before{ /* panel atas */ content:""; position:absolute; left:14%; right:14%; top:8%; height:34%;
    border-radius:8px; background:linear-gradient(180deg,#7a5228,#5f3f1f);
    box-shadow:inset 0 0 0 3px rgba(0,0,0,.25), inset 0 6px 12px rgba(0,0,0,.3); }
  .door::after{ /* panel bawah */ content:""; position:absolute; left:14%; right:14%; bottom:10%; height:38%;
    border-radius:8px; background:linear-gradient(180deg,#7a5228,#5f3f1f);
    box-shadow:inset 0 0 0 3px rgba(0,0,0,.25), inset 0 6px 12px rgba(0,0,0,.3); }
  .knob{ position:absolute; right:12%; top:52%; width:14px; height:14px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffe9a8, #c79a3f); box-shadow:0 0 10px rgba(255,220,140,.6);
    z-index:2; }
  .door-glow{ position:absolute; inset:-6% -10%; z-index:-1; border-radius:50%;
    background:radial-gradient(circle, rgba(255,224,150,.5), rgba(255,224,150,0) 70%);
    animation:doorPulse 3s ease-in-out infinite; }
  @keyframes doorPulse{ 0%,100%{ opacity:.5; } 50%{ opacity:.9; } }

  .tap-hint{ position:fixed; bottom:20px; left:0; right:0; text-align:center; z-index:4;
    font-family:var(--font-mono); font-size:12px; color:#3c2a17; opacity:.85; pointer-events:none; }
  .tap-hint .k{ display:inline-block; animation:bob 1.5s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-4px);} }

  .title-top{ position:fixed; top:0; left:0; right:0; text-align:center; padding:20px 16px;
    font-family:var(--font-display); font-weight:600; font-size:clamp(18px,5vw,26px); color:#4a3320;
    z-index:4; pointer-events:none; text-shadow:0 2px 6px rgba(255,240,200,.5); }

  /* ---------- MODAL PASSWORD ---------- */
  .lock-overlay{ position:fixed; inset:0; background:rgba(43,33,24,.6); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; padding:24px; z-index:20; }
  .lock-overlay.show{ display:flex; animation:fadeIn .2s ease; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .lock-card{ position:relative; width:100%; max-width:330px; background:var(--bg-panel); border-radius:18px;
    padding:24px 20px 20px; text-align:center; box-shadow:0 20px 48px rgba(0,0,0,.4); animation:pop .28s ease; }
  @keyframes pop{ from{opacity:0; transform:translateY(8px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }
  .lock-card.shake{ animation:shake .4s ease; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }
  .lock-icon{ width:56px; height:56px; margin:0 auto 10px; border-radius:50%;
    background:rgba(162,59,46,.1); display:flex; align-items:center; justify-content:center; font-size:26px; }
  .lock-title{ font-family:var(--font-display); font-weight:600; font-size:20px; color:var(--text); }
  .lock-sub{ font-family:var(--font-mono); font-size:11px; color:var(--text-muted); margin:8px 0 4px; line-height:1.5; }
  .lock-hint{ font-size:12px; color:var(--blush); margin-bottom:14px; }
  .lock-hint b{ font-weight:600; }
  .lock-form{ display:flex; gap:8px; }
  .lock-input{ flex:1; background:var(--bg-panel-2); border:1.5px solid var(--line); border-radius:10px;
    padding:12px; font-family:var(--font-mono); font-size:15px; color:var(--text); text-align:center; letter-spacing:.14em; }
  .lock-input::placeholder{ letter-spacing:normal; color:var(--text-muted); }
  .lock-go{ background:var(--blush); color:#f8f0dd; border:none; border-radius:10px; padding:0 18px;
    font-weight:600; cursor:pointer; font-size:14px; }
  .lock-err{ color:var(--blush); font-family:var(--font-mono); font-size:11px; min-height:16px; margin-top:10px; }
  .lock-close{ position:absolute; top:-14px; right:-14px; width:32px; height:32px; border-radius:50%;
    background:var(--bg-panel); color:var(--text); border:1.5px solid var(--line); font-size:15px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; }

  .enter-fade{ position:fixed; inset:0; background:#1c140c; z-index:40; opacity:0; pointer-events:none;
    transition:opacity .7s ease; }
  .enter-fade.show{ opacity:1; pointer-events:all; }
</style>
</head>
<body>
<div class="title-top">Kamar Elvira</div>

<div class="hall">
  <img class="hall-img" src="assets/depan.png" alt="" onerror="this.style.display='none';">
  <div class="floor"></div>
  <div class="rug"></div>

  <div class="door-wrap">
    <div class="plaque">✦ Elvira's Room ✦</div>
    <button class="door" id="door" aria-label="Pintu kamar">
      <span class="door-glow"></span>
      <span class="knob"></span>
    </button>
  </div>
</div>

<div class="tap-hint">ketuk pintunya buat masuk <span class="k">👆</span></div>

<!-- MODAL PASSWORD -->
<div class="lock-overlay" id="lockOverlay">
  <div class="lock-card" id="lockCard">
    <button class="lock-close" id="lockClose">✕</button>
    <div class="lock-icon">🔒</div>
    <div class="lock-title">Pintu Terkunci</div>
    <div class="lock-sub">Masukin password dulu buat masuk ke kamar ✨</div>
    <div class="lock-hint">💡 Hint: <b>nama depan kamu</b></div>
    <div class="lock-form">
      <input class="lock-input" id="lockInput" type="text" placeholder="ketik password…" autocomplete="off" spellcheck="false">
      <button class="lock-go" id="lockGo">Masuk</button>
    </div>
    <div class="lock-err" id="lockErr"></div>
  </div>
</div>

<div class="enter-fade" id="enterFade"></div>

<script>
if (window.Telegram && window.Telegram.WebApp) { const tg = window.Telegram.WebApp; tg.ready(); tg.expand(); }

const PASSWORD = 'elvira';
const lockOverlay = document.getElementById('lockOverlay');
const lockCard = document.getElementById('lockCard');
const lockInput = document.getElementById('lockInput');
const lockErr = document.getElementById('lockErr');
const enterFade = document.getElementById('enterFade');

function openLock(){
  lockOverlay.classList.add('show');
  lockErr.textContent = '';
  setTimeout(() => lockInput.focus(), 200);
}
function closeLock(){ lockOverlay.classList.remove('show'); }

document.getElementById('door').addEventListener('click', openLock);
document.getElementById('lockClose').addEventListener('click', closeLock);
lockOverlay.addEventListener('click', e => { if (e.target === lockOverlay) closeLock(); });

function tryEnter(){
  const val = (lockInput.value || '').trim().toLowerCase();
  if (val === PASSWORD){
    lockErr.style.color = 'var(--gold)';
    lockErr.textContent = 'Kebuka! selamat datang 💛';
    enterFade.classList.add('show');
    setTimeout(() => { location.href = 'sore.html'; }, 750);
  } else {
    lockErr.style.color = 'var(--blush)';
    lockErr.textContent = 'Salah, coba lagi ya 🙈 (hint: nama depan kamu)';
    lockCard.classList.remove('shake'); void lockCard.offsetWidth; lockCard.classList.add('shake');
    lockInput.select();
  }
}
document.getElementById('lockGo').addEventListener('click', tryEnter);
lockInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryEnter(); });
</script>
</body>
</html>
