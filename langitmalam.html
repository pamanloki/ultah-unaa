<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Langit Malam — Elvira</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --font-display:"Fraunces",serif; --font-body:"Plus Jakarta Sans",sans-serif; --font-mono:"JetBrains Mono",monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overflow:hidden; }
  body{ font-family:var(--font-body); color:#fff; }

  /* ---------- LANGIT MALAM ---------- */
  .sky{ position:fixed; inset:0; overflow:hidden;
    background:
      radial-gradient(1200px 700px at 80% -10%, #24356b 0%, rgba(36,53,107,0) 55%),
      radial-gradient(1000px 800px at 10% 110%, #3a2350 0%, rgba(58,35,80,0) 55%),
      linear-gradient(180deg, #05060f 0%, #0a1030 45%, #131a44 100%); }
  /* gambar langit malam (assets/langitmalam.png) */
  .sky-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; }
  /* kalau gambar ada, matiin dekorasi CSS biar nggak dobel; kalau gagal load, CSS jadi fallback */
  body.has-img .stars, body.has-img .moon, body.has-img .skyline{ display:none; }

  /* bintang */
  .stars, .stars2{ position:absolute; inset:0; }
  .star{ position:absolute; background:#fff; border-radius:50%;
    animation:twinkle var(--tw,3s) ease-in-out infinite; opacity:.85; }
  @keyframes twinkle{ 0%,100%{ opacity:.25; transform:scale(.7);} 50%{ opacity:1; transform:scale(1);} }

  /* bulan */
  .moon{ position:absolute; top:9%; right:12%; width:clamp(64px,12vw,120px); aspect-ratio:1;
    border-radius:50%; background:radial-gradient(circle at 36% 34%, #fdf6d8, #f3e4a5 60%, #e6cf7f 100%);
    box-shadow:0 0 44px 12px rgba(255,240,190,.35), inset -10px -8px 0 rgba(0,0,0,.06); }

  /* siluet kota di bawah */
  .skyline{ position:absolute; left:0; right:0; bottom:0; height:20%;
    background:linear-gradient(180deg, rgba(5,6,15,0) 0%, #05060f 88%); }
  .skyline::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:60%;
    background:
      linear-gradient(90deg, #070912 0 6%, transparent 6% 9%, #070912 9% 15%, transparent 15% 17%,
        #070912 17% 21%, transparent 21% 25%, #070912 25% 33%, transparent 33% 36%,
        #070912 36% 44%, transparent 44% 47%, #070912 47% 55%, transparent 55% 58%,
        #070912 58% 66%, transparent 66% 69%, #070912 69% 78%, transparent 78% 81%,
        #070912 81% 90%, transparent 90% 93%, #070912 93% 100%);
    -webkit-mask-image:linear-gradient(180deg, transparent, #000 40%);
            mask-image:linear-gradient(180deg, transparent, #000 40%); }

  /* ---------- KEMBANG API ---------- */
  .fx-layer{ position:absolute; inset:0; pointer-events:none; z-index:3; }
  .firework{ position:absolute; width:0; height:0; }
  .spark{ position:absolute; left:0; top:0; width:5px; height:5px; border-radius:50%;
    background:var(--c,#ffd166); box-shadow:0 0 8px 1px var(--c,#ffd166);
    transform:rotate(var(--a)) translateY(0); opacity:1;
    animation:burst var(--dur,1.15s) ease-out forwards; }
  @keyframes burst{
    0%{ transform:rotate(var(--a)) translateY(0) scale(1); opacity:1; }
    75%{ opacity:1; }
    100%{ transform:rotate(var(--a)) translateY(calc(var(--r,90px) * -1)) scale(.4); opacity:0; }
  }
  .rocket{ position:absolute; bottom:0; width:3px; height:14px; border-radius:2px;
    background:linear-gradient(#fff,rgba(255,255,255,0)); box-shadow:0 0 8px 2px rgba(255,240,200,.8);
    animation:launch var(--lt,1s) cubic-bezier(.2,.7,.4,1) forwards; }
  @keyframes launch{ to{ transform:translateY(calc(var(--ly,-60vh))); opacity:.2; } }

  /* ---------- TULISAN ULANG TAHUN ---------- */
  .greet{ position:fixed; inset:0; z-index:5; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px; pointer-events:none; }
  .greet .eyebrow{ font-family:var(--font-mono); letter-spacing:.32em; text-transform:uppercase;
    font-size:clamp(10px,2.6vw,14px); color:#ffd9a0; opacity:0; animation:fadeUp .8s ease .3s forwards; }
  .greet h1{ font-family:var(--font-display); font-weight:700; line-height:1.05;
    font-size:clamp(30px,8.5vw,88px); margin:10px 0 6px; color:#fff;
    text-shadow:0 0 18px rgba(255,209,102,.55), 0 0 44px rgba(255,120,180,.35);
    background:linear-gradient(90deg,#fff,#ffe6a1,#ff9ec4,#a9c8ff,#fff);
    background-size:220% auto; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    animation:shine 6s linear infinite, fadeUp .9s ease .15s both; }
  @keyframes shine{ to{ background-position:220% center; } }
  .greet .name{ display:block; font-size:clamp(26px,9vw,96px); }
  .greet .sub{ font-family:var(--font-display); font-style:italic; font-size:clamp(14px,3.6vw,22px);
    color:#f3e9d0; opacity:0; animation:fadeUp .9s ease .6s forwards; text-shadow:0 2px 10px rgba(0,0,0,.5); }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(16px);} to{ opacity:1; transform:translateY(0);} }

  .back{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:6;
    font-family:var(--font-mono); font-size:12px; color:#e7ddc7; text-decoration:none;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.22); backdrop-filter:blur(3px);
    padding:8px 16px; border-radius:20px; opacity:0; animation:fadeUp .8s ease 1.1s forwards; }
  .back:hover{ background:rgba(255,255,255,.16); }
</style>
</head>
<body>
<div class="sky" id="sky">
  <img class="sky-img" src="assets/langitmalam.png" alt="" onload="document.body.classList.add('has-img');" onerror="this.style.display='none';">
  <div class="stars" id="stars"></div>
  <div class="moon"></div>
  <div class="skyline"></div>
  <div class="fx-layer" id="fx"></div>
</div>

<div class="greet">
  <div class="eyebrow">✦ make a wish ✦</div>
  <h1>HAPPY BIRTHDAY<span class="name">ELVIRA BUNGA NASUTION</span></h1>
  <div class="sub">semoga semua maumu meluncur setinggi kembang api ini ya 🎆</div>
</div>

<a class="back" href="malam.html">← balik ke kamar</a>

<script>
if (window.Telegram && window.Telegram.WebApp) { const tg = window.Telegram.WebApp; tg.ready(); tg.expand(); }

/* ---------- bintang ---------- */
(function makeStars(){
  const wrap = document.getElementById('stars');
  for (let i=0;i<120;i++){
    const s = document.createElement('div'); s.className = 'star';
    const sz = Math.random()*2 + 1;
    s.style.width = sz+'px'; s.style.height = sz+'px';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*78 + '%';
    s.style.setProperty('--tw', (2 + Math.random()*3).toFixed(2)+'s');
    s.style.animationDelay = (Math.random()*3)+'s';
    wrap.appendChild(s);
  }
})();

/* ---------- kembang api ---------- */
const fx = document.getElementById('fx');
const COLORS = ['#ffd166','#ff6b9d','#8ecae6','#c8b6ff','#a0f0c0','#ffb4a2','#fff3b0'];

function launchFirework(x, y){
  // roket naik dulu
  const rocket = document.createElement('div');
  rocket.className = 'rocket';
  rocket.style.left = x + 'vw';
  const rise = (100 - y);              // dari bawah sampai titik ledak
  rocket.style.setProperty('--ly', '-' + rise + 'vh');
  rocket.style.setProperty('--lt', (0.7 + Math.random()*0.3).toFixed(2)+'s');
  fx.appendChild(rocket);

  setTimeout(() => {
    rocket.remove();
    explode(x, y);
  }, 750);
}

function explode(x, y){
  const c = COLORS[Math.floor(Math.random()*COLORS.length)];
  const c2 = COLORS[Math.floor(Math.random()*COLORS.length)];
  const fw = document.createElement('div');
  fw.className = 'firework';
  fw.style.left = x + 'vw';
  fw.style.top = y + 'vh';
  const n = 26, radius = 80 + Math.random()*70;
  for (let i=0;i<n;i++){
    const sp = document.createElement('span');
    sp.className = 'spark';
    sp.style.setProperty('--a', (i * (360/n)) + 'deg');
    sp.style.setProperty('--r', radius + 'px');
    sp.style.setProperty('--c', i % 2 ? c : c2);
    sp.style.setProperty('--dur', (1 + Math.random()*0.5).toFixed(2)+'s');
    fw.appendChild(sp);
  }
  fx.appendChild(fw);
  setTimeout(() => fw.remove(), 1700);
}

function randomShow(){
  const x = 12 + Math.random()*76;      // vw
  const y = 18 + Math.random()*42;      // vh (titik ledak)
  launchFirework(x, y);
}

// beberapa langsung, lalu terus-terusan
[0, 500, 1000].forEach(d => setTimeout(randomShow, d));
setInterval(() => { randomShow(); if (Math.random() > .5) setTimeout(randomShow, 350); }, 1300);

// klik/tap di mana aja -> kembang api di situ
document.getElementById('sky').addEventListener('pointerdown', e => {
  const x = e.clientX / window.innerWidth * 100;
  const y = e.clientY / window.innerHeight * 100;
  explode(x, Math.max(8, y));
});
</script>
</body>
</html>
