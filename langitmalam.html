<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Langit Malam — Elvira</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --font-display:"Fraunces",serif; --font-body:"Plus Jakarta Sans",sans-serif; --font-mono:"JetBrains Mono",monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overflow:hidden; }
  body{ font-family:var(--font-body); color:#fff; background:#0a1030; }

  /* ---------- LANGIT MALAM (gambar + fallback gradient) ---------- */
  .sky{ position:fixed; inset:0; overflow:hidden;
    background-color:#0a1030;
    background-image:
      url("assets/langitmalam.png"),
      radial-gradient(1200px 700px at 80% -10%, #24356b 0%, rgba(36,53,107,0) 55%),
      radial-gradient(1000px 800px at 10% 110%, #3a2350 0%, rgba(58,35,80,0) 55%),
      linear-gradient(180deg, #05060f 0%, #0a1030 45%, #131a44 100%);
    background-size:cover, auto, auto, auto;
    background-position:center, center, center, center;
    background-repeat:no-repeat; }

  /* ---------- KEMBANG API (digambar di canvas, biar nggak jadi kotak hitam di HP) ---------- */
  #fx{ position:fixed; inset:0; z-index:3; pointer-events:none; }

  /* ---------- TULISAN ULANG TAHUN ---------- */
  .greet{ position:fixed; inset:0; z-index:5; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px; pointer-events:none; }
  .greet .eyebrow{ font-family:var(--font-mono); letter-spacing:.32em; text-transform:uppercase;
    font-size:clamp(10px,2.6vw,14px); color:#ffd9a0; opacity:0; animation:fadeUp .8s ease .3s forwards;
    text-shadow:0 2px 8px rgba(0,0,0,.6); }
  .greet h1{ font-family:var(--font-display); font-weight:700; line-height:1.1;
    font-size:clamp(30px,8vw,82px); margin:8px 0 0; color:#ffe9c2; }
  .hbd .w{ display:inline-block; opacity:0; will-change:transform,opacity;
    text-shadow:0 0 16px rgba(255,209,102,.6), 0 0 44px rgba(255,140,180,.4), 0 3px 0 rgba(0,0,0,.4); }
  .hbd .name{ color:#ffd7e6; font-size:clamp(26px,8.4vw,88px);
    text-shadow:0 0 16px rgba(255,160,190,.6), 0 0 44px rgba(160,200,255,.4), 0 3px 0 rgba(0,0,0,.4); }
  .hbd .w.show{ animation:wordPop .7s cubic-bezier(.2,1.5,.4,1) forwards; }
  @keyframes wordPop{
    0%{ opacity:0; transform:translateY(14px) scale(.5); filter:brightness(2.2); }
    60%{ opacity:1; transform:translateY(0) scale(1.12); }
    100%{ opacity:1; transform:translateY(0) scale(1); filter:brightness(1); } }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(16px);} to{ opacity:1; transform:translateY(0);} }

  .greet .sub{ font-family:var(--font-display); font-style:italic; font-size:clamp(15px,3.8vw,24px);
    color:#f7ead0; margin-top:16px; opacity:0; text-shadow:0 2px 12px rgba(0,0,0,.7); }
  .greet .sub.show{ animation:fadeUp 1s ease forwards; }

  .back{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:6;
    font-family:var(--font-mono); font-size:12px; color:#f3e2bb; text-decoration:none;
    background:linear-gradient(#5c3a19,#3e2712); border:2px solid #150c04;
    box-shadow:2px 2px 0 rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.14);
    padding:9px 16px; opacity:0; animation:fadeUp .8s ease 1.1s forwards; }
  .back:active{ transform:translateX(-50%) translateY(1px); }
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<canvas id="fx"></canvas>

<div class="greet">
  <h1 class="hbd">
    <span class="w">HAPPY</span> <span class="w">BIRTHDAY</span><br>
    <span class="w name">ELVIRA</span> <span class="w name">BUNGA</span> <span class="w name">NASUTION</span>
  </h1>
  <div class="sub" id="subMsg">semoga apa yang kamu inginkan tercapai yaa, kak 🎉</div>
</div>

<a class="back" href="malam.html">← balik ke kamar</a>

<script>
if (window.Telegram && window.Telegram.WebApp) { const tg = window.Telegram.WebApp; tg.ready(); tg.expand(); }

/* ---------- lanjutin lagu dari malam.html ---------- */
(function resumeMusic(){
  let st=null;
  try { st = JSON.parse(sessionStorage.getItem('ultah_music') || 'null'); } catch(e){}
  if (!st || !st.src) return;
  const a = new Audio();
  a.src = st.src;
  a.addEventListener('loadedmetadata', () => { try { if (st.t) a.currentTime = st.t; } catch(e){} });
  a.addEventListener('timeupdate', () => {
    try { sessionStorage.setItem('ultah_music', JSON.stringify({ i:st.i, src:st.src, t:a.currentTime, playing:!a.paused })); } catch(e){}
  });
  const play = () => a.play().catch(()=>{});
  play(); // coba lanjut langsung
  const kick = () => { play(); if (!a.paused){ window.removeEventListener('pointerdown', kick); window.removeEventListener('keydown', kick); } };
  window.addEventListener('pointerdown', kick);
  window.addEventListener('keydown', kick);
})();

/* ============================================================
   KEMBANG API — digambar di <canvas>.
   Alasan: kalau tiap percikan bikin elemen DOM transparan yg
   dianimasi transform, WebView HP (Telegram/Android) nge-cat
   area transparannya jadi kotak hitam. Canvas = 1 bitmap, aman.
   ============================================================ */
const canvas = document.getElementById('fx');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// warna kembang api (RGB)
const COLORS = [
  [255,209,102],[255,107,157],[142,202,230],[200,182,255],
  [160,240,192],[255,180,162],[255,243,176]
];
const rnd = a => a[Math.floor(Math.random()*a.length)];

const rockets = [];  // roket yg naik
const sparks  = [];  // percikan setelah meledak
let flashLife = 0;   // kilatan pas meledak (0..1)

function drawGlow(x, y, size, c, alpha){
  const rad = size * 4;
  const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
  g.addColorStop(0,   'rgba('+c[0]+','+c[1]+','+c[2]+','+alpha+')');
  g.addColorStop(0.4, 'rgba('+c[0]+','+c[1]+','+c[2]+','+(alpha*0.55)+')');
  g.addColorStop(1,   'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI*2); ctx.fill();
}

function explode(x, y, cb){
  const c1 = rnd(COLORS), c2 = rnd(COLORS);
  const n = 38, base = 3.4 + Math.random()*1.4;
  for (let i=0;i<n;i++){
    const a = (i/n) * Math.PI*2 + Math.random()*0.12;
    const v = base * (0.55 + Math.random()*0.7);
    sparks.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v,
      life:1, decay:0.010 + Math.random()*0.012,
      color: i%2 ? c1 : c2, size: 1.8 + Math.random()*1.6 });
  }
  flashLife = 1;
  if (cb) cb();
}

// x,y dalam PERSEN layar (biar sama kayak versi lama)
function launchFirework(xPct, yPct, cb){
  const x  = xPct/100 * W;
  const ty = yPct/100 * H;
  const vy = (ty - H) / 46;            // sampai target ~0.75s @60fps
  rockets.push({ x, y:H, ty, vy, color:rnd(COLORS), cb });
}
function randomShow(){ launchFirework(12 + Math.random()*76, 18 + Math.random()*42); }

function tick(){
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';

  // kilatan lembut pas meledak
  if (flashLife > 0){
    const g = ctx.createRadialGradient(W*0.5, H*0.42, 0, W*0.5, H*0.42, Math.max(W,H)*0.6);
    g.addColorStop(0, 'rgba(255,240,200,'+(flashLife*0.22)+')');
    g.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    flashLife -= 0.06;
  }

  // roket naik
  for (let i=rockets.length-1;i>=0;i--){
    const r = rockets[i];
    r.y += r.vy;
    drawGlow(r.x, r.y, 2.4, r.color, 1);
    if (r.y <= r.ty){ explode(r.x, r.y, r.cb); rockets.splice(i,1); }
  }

  // percikan
  for (let i=sparks.length-1;i>=0;i--){
    const p = sparks[i];
    p.vx *= 0.985; p.vy = p.vy*0.985 + 0.03;   // gesekan + gravitasi
    p.x += p.vx; p.y += p.vy; p.life -= p.decay;
    if (p.life <= 0){ sparks.splice(i,1); continue; }
    drawGlow(p.x, p.y, p.size, p.color, Math.max(0, p.life));
  }

  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------- urutan: tiap roket meledak -> muncul 1 kata ---------- */
const words = document.querySelectorAll('.hbd .w');
function revealWord(i){ if (words[i]) words[i].classList.add('show'); }

let ambientOn = false;
function startAmbient(){
  if (ambientOn) return; ambientOn = true;
  setInterval(() => {
    randomShow();
    if (Math.random() > .35) setTimeout(randomShow, 280);
    if (Math.random() > .6)  setTimeout(randomShow, 560);
  }, 900);
}

let wi = 0;
function nextShot(){
  if (wi >= words.length){
    const sub = document.getElementById('subMsg'); if (sub) sub.classList.add('show');
    setTimeout(startAmbient, 500); return;
  }
  // roket dari tengah-bawah; pas meledak -> reveal 1 kata, lanjut kata berikutnya
  launchFirework(45 + Math.random()*10, 22 + Math.random()*16, () => {
    revealWord(wi); wi++; setTimeout(nextShot, 1050);
  });
}
setTimeout(nextShot, 900);  // mulai bentar setelah kebuka

// ketuk langit -> meledak di situ
document.getElementById('sky').addEventListener('pointerdown', e => {
  explode(e.clientX, Math.max(H*0.08, e.clientY));
});
</script>
</body>
</html>
