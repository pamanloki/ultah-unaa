<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kamar Elvira</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efe2c4; --bg-panel:#f8f0dd; --bg-panel-2:#e7d7ae;
    --gold:#a8763a; --blush:#a23b2e; --text:#2b2118; --text-muted:#8a7757;
    --line:rgba(43,33,24,0.16);
    --font-display:"Fraunces",serif; --font-body:"Plus Jakarta Sans",sans-serif; --font-mono:"JetBrains Mono",monospace;

    /* ---- ATUR UKURAN/POSISI OBJEK DI SINI ---- */
    --cat-fw: clamp(72px, 22vw, 108px);   /* lebar 1 frame kucing */
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:#2b2118;
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    overflow-x:hidden;
    display:flex; flex-direction:column; align-items:center;
  }
  img{ image-rendering:pixelated; image-rendering:crisp-edges; }

  /* ---------- STAGE: kamar ---------- */
  .stage{
    position:relative;
    width:100%;
    max-width:480px;
    aspect-ratio: 800 / 900;            /* samain dgn rasio gambar room asli nanti */
    margin:0 auto;
    overflow:hidden;
    background:#000;
  }
  .room-bg{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  /* debu/cahaya melayang */
  .dust{ position:absolute; width:3px; height:3px; border-radius:50%;
    background:rgba(255,240,190,0.8); pointer-events:none;
    animation:floatUp linear infinite; opacity:0; }
  @keyframes floatUp{
    0%{ transform:translateY(20px); opacity:0; }
    15%{ opacity:.9; }
    85%{ opacity:.6; }
    100%{ transform:translateY(-120px); opacity:0; }
  }

  /* ---------- OBJEK INTERAKTIF (generik) ---------- */
  .obj{
    position:absolute;
    transform:translate(-50%,-50%);
    background:transparent; border:none; padding:0; cursor:pointer;
    display:block;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.28));
    transition: transform .18s ease, filter .18s ease;
  }
  .obj img{ width:100%; height:auto; display:block; pointer-events:none; }
  .obj::after{ /* cincin hint interaktif */
    content:""; position:absolute; inset:-10%;
    border-radius:50%;
    box-shadow:0 0 0 0 rgba(255,238,180,0);
    transition:box-shadow .2s ease;
    pointer-events:none;
  }
  .obj:hover{ transform:translate(-50%,-50%) scale(1.06); filter:drop-shadow(0 4px 8px rgba(0,0,0,0.35)) brightness(1.06); }
  .obj:hover::after,.obj:focus-visible::after{ box-shadow:0 0 22px 6px rgba(255,238,180,0.55); }
  .obj:active{ transform:translate(-50%,-50%) scale(0.95); }

  /* animasi: goyang (amplop) */
  @keyframes wiggle{
    0%,100%{ transform:translate(-50%,-50%) rotate(-5deg); }
    50%{ transform:translate(-50%,-50%) rotate(5deg); }
  }
  .anim-wiggle{ animation:wiggle 1.4s ease-in-out infinite; transform-origin:center; }
  .anim-wiggle:hover{ animation-play-state:paused; }

  /* animasi: mengambang (balon dll) */
  @keyframes bob{
    0%,100%{ transform:translate(-50%,-50%) translateY(0); }
    50%{ transform:translate(-50%,-50%) translateY(-8px); }
  }
  .anim-bob{ animation:bob 2.6s ease-in-out infinite; }

  /* animasi: kedip cahaya (foto/frame) */
  @keyframes pulseGlow{
    0%,100%{ filter:drop-shadow(0 0 2px rgba(255,238,180,0.2)); }
    50%{ filter:drop-shadow(0 0 10px rgba(255,238,180,0.7)); }
  }
  .anim-glow{ animation:pulseGlow 3s ease-in-out infinite; }

  /* ---------- KUCING (sprite 8 frame) ---------- */
  .cat{
    position:absolute;
    transform:translate(-50%,-50%);
    width:var(--cat-fw);
    aspect-ratio:1;                       /* frame kotak; ubah kalau perlu */
    background-image:url("assets/cat.png");
    background-repeat:no-repeat;
    background-size: calc(var(--cat-fw) * 8) 100%;   /* 8 frame horizontal */
    background-position:0 0;
    image-rendering:pixelated;
    cursor:pointer;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,0.3));
    animation: catIdle 1.15s steps(8) infinite;
  }
  @keyframes catIdle{
    to{ background-position: calc(var(--cat-fw) * -8) 0; }
  }
  /* pas diklik: main lebih cepat sebentar */
  .cat.happy{ animation: catIdle .55s steps(8) infinite; }

  /* gelembung ucapan kecil */
  .bubble{
    position:absolute; transform:translate(-50%,-100%);
    background:var(--bg-panel); color:var(--text);
    font-family:var(--font-mono); font-size:11px;
    padding:6px 10px; border-radius:10px; white-space:nowrap;
    border:1.5px solid var(--line);
    opacity:0; pointer-events:none; transition:opacity .2s ease;
    z-index:6;
  }
  .bubble.show{ opacity:1; }

  /* ---------- JUDUL ---------- */
  .banner{
    position:absolute; top:0; left:0; right:0;
    text-align:center; padding:14px 16px 22px;
    font-family:var(--font-display); font-weight:600;
    font-size:clamp(17px,4.6vw,22px); color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,0.55);
    background:linear-gradient(to bottom, rgba(43,33,24,0.45), transparent);
    z-index:5; pointer-events:none;
  }
  .hint-tap{
    position:absolute; bottom:14px; left:0; right:0; text-align:center;
    font-family:var(--font-mono); font-size:11px; color:#fff;
    text-shadow:0 1px 4px rgba(0,0,0,0.6); z-index:5; pointer-events:none;
    opacity:.85;
  }

  /* ---------- MODAL (dipakai ulang, gaya sketsa) ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(43,33,24,0.55);
    backdrop-filter:blur(2px); display:none; align-items:center; justify-content:center;
    padding:24px; z-index:30; }
  .modal-overlay.show{ display:flex; animation:fadeIn .2s ease; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .modal-card{ position:relative; max-width:300px; width:100%; background:var(--bg-panel);
    border-radius:16px; padding:14px; animation:pop .25s ease; }
  .modal-card::before{ content:""; position:absolute; inset:0; border:2px solid var(--line);
    border-radius:inherit; filter:url(#sketchy); pointer-events:none; }
  .modal-art{ background:repeating-linear-gradient(45deg,var(--bg-panel-2) 0 5px,var(--bg-panel) 5px 10px);
    border-radius:10px; padding:22px 10px 16px; display:flex; flex-direction:column; align-items:center; gap:8px; position:relative; }
  .modal-art::before{ content:""; position:absolute; inset:0; border:1.5px solid var(--line);
    border-radius:inherit; filter:url(#sketchy); pointer-events:none; }
  .modal-icon svg{ width:46px; height:46px; color:var(--blush); }
  .modal-title{ font-family:var(--font-display); font-weight:600; font-size:17px; color:var(--text); }
  .modal-num{ font-family:var(--font-mono); font-size:10px; letter-spacing:.04em; color:var(--text-muted); }
  .modal-text-box{ background:var(--bg-panel-2); border-radius:10px; padding:14px; margin-top:10px; position:relative; }
  .modal-text-box::before{ content:""; position:absolute; inset:0; border:1.5px solid var(--line);
    border-radius:inherit; filter:url(#sketchy); pointer-events:none; }
  .modal-text{ font-size:14px; line-height:1.6; color:var(--text); position:relative; }
  .modal-close{ position:absolute; top:-14px; right:-14px; width:32px; height:32px; border-radius:50%;
    background:var(--bg-panel); color:var(--text); border:1.5px solid var(--line); font-size:15px;
    display:flex; align-items:center; justify-content:center; z-index:2; cursor:pointer; }
  @keyframes pop{ from{opacity:0; transform:translateY(6px) scale(0.97);} to{opacity:1; transform:translateY(0) scale(1);} }

  /* confetti */
  .confetti{ position:fixed; top:-10px; pointer-events:none; width:7px; height:10px; border-radius:2px;
    animation:fall 1.4s linear forwards; z-index:50; }
  @keyframes fall{ to{ transform:translateY(100vh) rotate(360deg); opacity:.2; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="sketchy">
    <feTurbulence type="fractalNoise" baseFrequency="0.045 0.09" numOctaves="2" seed="4" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2"/>
  </filter>
</svg>

<div class="stage" id="stage">
  <img class="room-bg" id="roomBg" src="assets/room.png" alt="kamar">
  <div class="banner">Met ulang tahun, Elvira 🎂</div>
  <!-- objek diisi lewat JS -->
  <div class="hint-tap" id="hintTap">colek benda-benda di kamar ✦</div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-art">
      <span class="modal-icon" id="modalIcon"></span>
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-num" id="modalNum"></div>
    </div>
    <div class="modal-text-box"><div class="modal-text" id="modalText"></div></div>
  </div>
</div>

<script>
/* ---------- Telegram init ---------- */
if (window.Telegram && window.Telegram.WebApp) {
  const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
}

/* ============================================================
   KONFIG OBJEK — tambah/ubah di sini (satu-satu)
   x,y = posisi tengah objek dalam % dari stage (0-100)
   w   = lebar objek dalam % dari lebar stage
   img = path gambar di folder assets/
   anim= 'wiggle' | 'bob' | 'glow' | null
   ============================================================ */
const iconEnvelope = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M3 6l9 6 9-6"/></svg>';
const iconHeart = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20s-7-4.4-9.5-9C.8 7.8 2.6 4 6.2 4c2 0 3.4 1.1 4 2.4C10.8 5.1 12.2 4 14.2 4c3.6 0 5.4 3.8 3.7 7-2.5 4.6-9.5 9-9.5 9z"/></svg>';

const OBJECTS = [
  {
    id:'envelope', img:'assets/envelope.png',
    x:64, y:64, w:16, anim:'wiggle',
    title:'Amplop', icon:iconEnvelope,
    msg:'Satu hal yang pengen aku bilang tapi belum sempat: [isi pesan].'
  }
  // contoh objek lain (tinggal upload gambarnya nanti):
  // { id:'cake', img:'assets/cake.png', x:40, y:60, w:18, anim:'glow', title:'Kue', icon:iconHeart, msg:'...' },
  // { id:'photo', img:'assets/photo.png', x:30, y:28, w:14, anim:'glow', title:'Foto Kita', icon:iconHeart, msg:'...' },
];

/* ---------- render objek ---------- */
const stage = document.getElementById('stage');
const hintTap = document.getElementById('hintTap');

OBJECTS.forEach(o => {
  const btn = document.createElement('button');
  btn.className = 'obj' + (o.anim ? ' anim-' + o.anim : '');
  btn.style.left = o.x + '%';
  btn.style.top = o.y + '%';
  btn.style.width = o.w + '%';
  btn.setAttribute('aria-label', o.title);
  btn.innerHTML = `<img src="${o.img}" alt="${o.title}">`;
  btn.addEventListener('click', () => openModal(o.title, o.icon, o.msg));
  stage.appendChild(btn);
});

/* ---------- KUCING ---------- */
const CAT = { x:78, y:88, meows:['miaw ~','purr...','met ultah, majikan 🐾','😺'] };
const cat = document.createElement('div');
cat.className = 'cat';
cat.style.left = CAT.x + '%';
cat.style.top = CAT.y + '%';
stage.appendChild(cat);

const bubble = document.createElement('div');
bubble.className = 'bubble';
stage.appendChild(bubble);

cat.addEventListener('click', () => {
  cat.classList.add('happy');
  const msg = CAT.meows[Math.floor(Math.random()*CAT.meows.length)];
  bubble.textContent = msg;
  bubble.style.left = CAT.x + '%';
  bubble.style.top = (CAT.y - 12) + '%';
  bubble.classList.add('show');
  burstConfetti(10);
  clearTimeout(cat._t);
  cat._t = setTimeout(() => { cat.classList.remove('happy'); bubble.classList.remove('show'); }, 1600);
});

/* ---------- modal ---------- */
const modalOverlay = document.getElementById('modalOverlay');
const modalIcon = document.getElementById('modalIcon');
const modalTitle = document.getElementById('modalTitle');
const modalNum = document.getElementById('modalNum');
const modalText = document.getElementById('modalText');
document.getElementById('modalClose').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });

function openModal(title, icon, msg){
  modalTitle.textContent = title;
  modalIcon.innerHTML = icon;
  modalNum.textContent = '';
  modalText.textContent = msg;
  modalOverlay.classList.add('show');
  hintTap.style.opacity = 0;
  burstConfetti(16);
}
function closeModal(){ modalOverlay.classList.remove('show'); }

/* ---------- debu melayang ---------- */
(function makeDust(){
  for (let i=0;i<14;i++){
    const d = document.createElement('div');
    d.className = 'dust';
    d.style.left = Math.random()*100 + '%';
    d.style.top = (40 + Math.random()*55) + '%';
    d.style.animationDuration = (5 + Math.random()*6) + 's';
    d.style.animationDelay = (Math.random()*6) + 's';
    stage.appendChild(d);
  }
})();

/* ---------- confetti ---------- */
function burstConfetti(n){
  const colors = ['#a8763a','#a23b2e','#f8f0dd','#e7d7ae'];
  for (let i=0;i<n;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100 + 'vw';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay = (Math.random()*0.4) + 's';
    c.style.animationDuration = (1.1 + Math.random()*0.8) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2200);
  }
}
</script>
</body>
</html>
